# ============================================================================
# BantuExpress — Docker Compose (développement local)
#
# Services :
#   postgis : PostgreSQL 16 + PostGIS 3.4 + contrib (uuid-ossp) — base requise
#             par Prisma (extensions postgis, uuid_ossp déclarées dans le schéma).
#   api     : le backend NestJS (build depuis le Dockerfile racine).
#
# Usage :
#   docker compose -f docker/docker-compose.yml up -d --build
#
# Note : l'API et la base partagent un réseau interne. L'API atteint la base
# via le nom de service `postgis` (DATABASE_URL interne), indépendant de
# localhost (qui reste disponible depuis l'hôte via le port exposé 5432).
# ============================================================================

name: bantuexpress

services:
  postgis:
    build:
      context: .
      dockerfile: db.Dockerfile
    image: bantuexpress-postgis:16-3.4
    container_name: bantuexpress-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-bantuexpress}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-motdepasse}
      POSTGRES_DB: ${POSTGRES_DB:-bantuexpress_dev}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgis_data:/var/lib/postgresql/data
    networks:
      - bantuexpress-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-bantuexpress} -d ${POSTGRES_DB:-bantuexpress_dev}"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ..
      dockerfile: Dockerfile
    image: bantuexpress-api:local
    container_name: bantuexpress-api
    restart: unless-stopped
    depends_on:
      postgis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      PORT: ${PORT:-3000}
      # Hôte interne `postgis` : l'API et la base sont sur le même réseau compose.
      DATABASE_URL: "postgresql://${POSTGRES_USER:-bantuexpress}:${POSTGRES_PASSWORD:-motdepasse}@postgis:5432/${POSTGRES_DB:-bantuexpress_dev}?schema=public"
      JWT_SECRET: ${JWT_SECRET:-dev-secret-a-remplacer-en-production}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-3600s}
      CORS_ORIGIN: ${CORS_ORIGIN:-}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3001}
      CSRF_SECRET: ${CSRF_SECRET:-}
      SENTRY_DSN: ${SENTRY_DSN:-}
      RESEND_API_KEY: ${RESEND_API_KEY:-}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-}
      AT_API_KEY: ${AT_API_KEY:-}
      AT_USERNAME: ${AT_USERNAME:-}
      AT_SENDER_ID: ${AT_SENDER_ID:-}
    ports:
      - "${API_PORT:-3000}:3000"
    volumes:
      - uploads_data:/app/uploads
    networks:
      - bantuexpress-net
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 20s
      retries: 3

networks:
  bantuexpress-net:
    name: bantuexpress-net
    driver: bridge

volumes:
  postgis_data:
    name: bantuexpress_postgis_data
  uploads_data:
    name: bantuexpress_uploads_data
